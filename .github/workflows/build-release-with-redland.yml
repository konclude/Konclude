name: Build Releases (with Redland)

# Builds the release packages of Konclude for Windows, macOS and Linux and collects them in a
# draft GitHub release. The workflow runs for tags that match releases/v*, where the name of
# the release is the tag without the releases/ prefix, and it can be started manually, where
# the release is named after the most recent tag and its creation can be switched off to only
# build and test the packages.
on:
  push:
    tags:
      - 'releases/v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release with the built packages'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Qt version that is statically compiled for the macOS and Linux packages. Only the qtbase
  # module is built, since Konclude does not require any other module.
  QT_STATIC_VERSION: 5.15.17
  # Increase whenever the configuration of the static Qt build changes, to invalidate the cache.
  QT_STATIC_CACHE_REVISION: 2
  # Qt version that is dynamically linked for the Windows package.
  QT_WINDOWS_VERSION: 5.15.2


jobs:


  tags:
    name: Identify tags
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.get_tags.outputs.git_tag }}
      revision_hash: ${{ steps.get_tags.outputs.revision_hash }}
      revision_tag: ${{ steps.get_tags.outputs.revision_tag }}
      revision_build: ${{ steps.get_tags.outputs.revision_build }}
      publish: ${{ steps.get_tags.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify git tags
        id: get_tags
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git_tag="${GITHUB_REF_NAME#releases/}"
          else
            git_tag="$(git describe --tags --abbrev=0)"
          fi
          revision_hash="$(git rev-parse --short=8 HEAD)"
          IFS='-' read -r revision_tag revision_build <<< "$git_tag"
          if [ -z "$revision_tag" ] || [ -z "$revision_build" ]; then
            echo "::error::The tag '$git_tag' does not have the form <version>-<build>, e.g., v0.7.0-1138."
            exit 1
          fi
          echo "tag: $git_tag, version: $revision_tag, build: $revision_build, hash: $revision_hash, publish: $PUBLISH"
          {
            echo "git_tag=$git_tag"
            echo "revision_hash=$revision_hash"
            echo "revision_tag=$revision_tag"
            echo "revision_build=$revision_build"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"




  build_windows:
    name: Windows x64 MSVC Dynamic
    runs-on: windows-latest
    timeout-minutes: 180
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-Windows-x64-MSVC-Dynamic-Qt5.15.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Revision Information
        shell: bash
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > revision-git.h
          cat revision-git.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_WINDOWS_VERSION }}
          cache: true

      # Qt 5.15.2 cannot be compiled with the standard library of Visual Studio 2022 17.10 and
      # above, see build-without-redland.yml, so the Visual Studio 2019 tool set is used, which
      # is the one the msvc2019_64 build of Qt has been made with.
      - name: Prepare Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.29'

      # The project targets the Visual Studio 2015 tool set and the Windows 8.1 SDK, neither of
      # which is available on the runners, so the tool set above and the installed Windows 10 SDK
      # are selected instead. The project expects the root directory of Qt in Qt5_Dir, whereas
      # install-qt-action sets Qt5_DIR to the CMake directory of Qt.
      - name: Compile Windows
        run: |
          msbuild Konclude-VS15.sln /m /p:Configuration=Release /p:Platform=Win64 /p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0 "/p:Qt5_Dir=$env:QT_ROOT_DIR"

      - name: Create Konclude Release
        run: |
          $RELEA = "Release\$env:RELEASE_NAME"
          New-Item -ItemType Directory -Force -Path "$RELEA\Configs", "$RELEA\Tests", "$RELEA\Binaries" | Out-Null

          Copy-Item "x64\Release\VS2015\Konclude.exe" "$RELEA\Binaries"
          Copy-Item "External\vcpkg\Windows\x64\bin\*.dll" "$RELEA\Binaries"
          foreach ($module in "Core", "Network", "Concurrent", "Xml") {
            Copy-Item "$env:QT_ROOT_DIR\bin\Qt5$module.dll" "$RELEA\Binaries"
          }

          Copy-Item "LGPL-3.0.txt", "GPL.txt", "Readme.md", "Scripts\Konclude.bat" "$RELEA"
          Copy-Item "Configs\default-config.xml", "Configs\querying-config.xml" "$RELEA\Configs"
          foreach ($test in "1b-satisfiability-request.xml", "galen.owl.xml", "galen-classify-request.xml",
                            "galen-ALEHIF+-classify-request.xml", "roberts-family-full-D.owl.xml",
                            "roberts-family-full-D-classify-realize-request.xml", "lubm-univ-bench.owl.xml",
                            "lubm-univ-bench-data-1.ttl", "lubm-univ-bench-sparql-load-and-query-test.sparql",
                            "lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql",
                            "roberts-family-full-sparql-existential-variables-query-test.sparql", "test-request.xml") {
            Copy-Item "Tests\$test" "$RELEA\Tests"
          }

      - name: Run Examples Windows
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          .\Konclude.bat classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          .\Konclude.bat satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          .\Konclude.bat owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          .\Konclude.bat owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          .\Konclude.bat owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          .\Konclude.bat sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          .\Konclude.bat sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          Remove-Item roberts-family-full-class-hierarchy.owl.xml, response.xml, Tests/query-answers.xml -ErrorAction SilentlyContinue

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$env:RELEASE_NAME.zip" "$env:RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error




  build_macosx:
    name: macOS arm64 Clang Static
    runs-on: macos-latest
    timeout-minutes: 240
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-OSX-arm64-Clang-Static-Qt5.15.17

    steps:
      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: konclude-static

      - name: Update Revision Information
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > konclude-static/revision-git.h
          cat konclude-static/revision-git.h

      # The bison of the Xcode tools is too old to generate the parser of rasqal.
      - name: Install Dependencies
        run: |
          brew install autoconf automake libtool bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: qt-static
          key: qt-static-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_STATIC_VERSION }}-${{ env.QT_STATIC_CACHE_REVISION }}

      - name: Compile Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          ROOT="$(pwd)"
          curl -fsSL --retry 5 -o qtbase.tar.xz "https://download.qt.io/archive/qt/${QT_STATIC_VERSION%.*}/$QT_STATIC_VERSION/submodules/qtbase-everywhere-opensource-src-$QT_STATIC_VERSION.tar.xz"
          tar -xJf qtbase.tar.xz
          cd "qtbase-everywhere-src-$QT_STATIC_VERSION"
          ./configure -static -release -opensource -confirm-license -prefix "$ROOT/qt-static" -platform macx-clang \
            -no-gui -no-widgets -no-opengl -no-icu -no-dbus -no-feature-gssapi -no-zstd -qt-pcre \
            -no-sql-mysql -no-sql-psql -no-sql-odbc -nomake examples -nomake tests \
            QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Compile Dependencies
        run: |
          konclude-static/.github/scripts/build-static-dependencies.sh deps konclude-static

      # The generic library line of Konclude.pro refers to the shared libraries of libltdl and
      # GMP, which are not needed or linked statically here.
      - name: Prepare Konclude Compilation
        working-directory: konclude-static
        run: |
          sed -i '' -e 's#^unix: LIBS += -lz -lltdl -lgmp -ldl -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#unix: LIBS += -lz -liconv External/librdf/Linux/x64/lib/release/libgmp.a -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#' Konclude.pro
          grep -n "^unix: LIBS += -lz" Konclude.pro
          ../qt-static/bin/qmake CONFIG+=release CONFIG-=debug CONFIG+=static Konclude.pro -after "QT-=gui"

      - name: Compile Konclude
        working-directory: konclude-static
        run: |
          make -j"$(sysctl -n hw.ncpu)"
          otool -L Release/Konclude.app/Contents/MacOS/Konclude
          # the package must not depend on libraries outside of macOS, such as Homebrew ones
          if otool -L Release/Konclude.app/Contents/MacOS/Konclude | tail -n +2 | grep -vE "^\s*(/usr/lib/|/System/Library/)"; then
            echo "::error::Konclude depends on the libraries listed above, which are not part of macOS."
            exit 1
          fi

      - name: Create Konclude Release
        run: |
          ROOT="$(pwd)"
          PROJ="$ROOT/konclude-static"
          RELEA="$ROOT/Release/$RELEASE_NAME"
          mkdir -p "$RELEA/Configs" "$RELEA/Tests" "$RELEA/Binaries"

          cp "$PROJ/Release/Konclude.app/Contents/MacOS/Konclude" "$RELEA/Binaries"
          cp "$PROJ/LGPL-3.0.txt" "$PROJ/GPL.txt" "$PROJ/Readme.md" "$PROJ/Scripts/Konclude" "$PROJ/Scripts/Konclude.sh" "$RELEA"
          cp "$PROJ/Configs/default-config.xml" "$PROJ/Configs/querying-config.xml" "$RELEA/Configs"
          for test in 1b-satisfiability-request.xml galen.owl.xml galen-classify-request.xml \
                      galen-ALEHIF+-classify-request.xml roberts-family-full-D.owl.xml \
                      roberts-family-full-D-classify-realize-request.xml lubm-univ-bench.owl.xml \
                      lubm-univ-bench-data-1.ttl lubm-univ-bench-sparql-load-and-query-test.sparql \
                      lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql \
                      roberts-family-full-sparql-existential-variables-query-test.sparql test-request.xml; do
            cp "$PROJ/Tests/$test" "$RELEA/Tests"
          done
          chmod 755 "$RELEA/Binaries/Konclude" "$RELEA/Konclude" "$RELEA/Konclude.sh"

      - name: Konclude Examples Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          rm -f roberts-family-full-class-hierarchy.owl.xml response.xml Tests/query-answers.xml

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error




  build_linux:
    name: Linux x64 GCC Static
    # the oldest available runner, so that the package runs with as old a glibc as possible
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-Linux-x64-GCC-Static-Qt5.15.17

    steps:
      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: konclude-static

      - name: Update Revision Information
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > konclude-static/revision-git.h
          cat konclude-static/revision-git.h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config flex bison gperf \
            zlib1g-dev p7zip-full

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: qt-static
          key: qt-static-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_STATIC_VERSION }}-${{ env.QT_STATIC_CACHE_REVISION }}

      # Features that would link further shared libraries into Qt are switched off, since they
      # might not be available on the systems the package is used on.
      - name: Compile Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          ROOT="$(pwd)"
          curl -fsSL --retry 5 -o qtbase.tar.xz "https://download.qt.io/archive/qt/${QT_STATIC_VERSION%.*}/$QT_STATIC_VERSION/submodules/qtbase-everywhere-opensource-src-$QT_STATIC_VERSION.tar.xz"
          tar -xJf qtbase.tar.xz
          cd "qtbase-everywhere-src-$QT_STATIC_VERSION"
          ./configure -static -release -opensource -confirm-license -prefix "$ROOT/qt-static" -platform linux-g++ \
            -no-gui -no-widgets -no-opengl -no-icu -no-dbus -no-feature-gssapi -no-zstd -no-glib -no-libproxy -qt-pcre \
            -no-sql-mysql -no-sql-psql -no-sql-odbc -nomake examples -nomake tests
          make -j"$(nproc)"
          make install

      - name: Compile Dependencies
        run: |
          konclude-static/.github/scripts/build-static-dependencies.sh deps konclude-static

      # The generic library line of Konclude.pro refers to the shared libraries of libltdl and
      # GMP, which are not needed or linked statically here. The C++ runtime is linked
      # statically as well, so that the package does not require a recent libstdc++.
      - name: Prepare Konclude Compilation
        working-directory: konclude-static
        run: |
          sed -i -e 's#^unix: LIBS += -lz -lltdl -lgmp -ldl -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#unix: LIBS += -lz -ldl -lpthread External/librdf/Linux/x64/lib/release/libgmp.a -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#' Konclude.pro
          grep -n "^unix: LIBS += -lz" Konclude.pro
          ../qt-static/bin/qmake CONFIG+=release CONFIG-=debug CONFIG+=static "QMAKE_LFLAGS+=-static-libstdc++ -static-libgcc" Konclude.pro -after "QT-=gui"

      - name: Compile Konclude
        working-directory: konclude-static
        run: |
          make -j"$(nproc)"
          ldd Release/Konclude
          # the package may only depend on the libraries of the C library and zlib
          if ldd Release/Konclude | grep -vE "(linux-vdso|ld-linux-[a-z0-9_-]+|libc|libm|libdl|libpthread|librt|libz)\.so"; then
            echo "::error::Konclude depends on the libraries listed above, which might not be available."
            exit 1
          fi

      - name: Create Konclude Release
        run: |
          ROOT="$(pwd)"
          PROJ="$ROOT/konclude-static"
          RELEA="$ROOT/Release/$RELEASE_NAME"
          mkdir -p "$RELEA/Configs" "$RELEA/Tests" "$RELEA/Binaries"

          cp "$PROJ/Release/Konclude" "$RELEA/Binaries"
          cp "$PROJ/LGPL-3.0.txt" "$PROJ/GPL.txt" "$PROJ/Readme.md" "$PROJ/Scripts/Konclude" "$PROJ/Scripts/Konclude.sh" "$RELEA"
          cp "$PROJ/Configs/default-config.xml" "$PROJ/Configs/querying-config.xml" "$RELEA/Configs"
          for test in 1b-satisfiability-request.xml galen.owl.xml galen-classify-request.xml \
                      galen-ALEHIF+-classify-request.xml roberts-family-full-D.owl.xml \
                      roberts-family-full-D-classify-realize-request.xml lubm-univ-bench.owl.xml \
                      lubm-univ-bench-data-1.ttl lubm-univ-bench-sparql-load-and-query-test.sparql \
                      lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql \
                      roberts-family-full-sparql-existential-variables-query-test.sparql test-request.xml; do
            cp "$PROJ/Tests/$test" "$RELEA/Tests"
          done
          chmod 755 "$RELEA/Binaries/Konclude" "$RELEA/Konclude" "$RELEA/Konclude.sh"

      - name: Konclude Examples Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          rm -f roberts-family-full-class-hierarchy.owl.xml response.xml Tests/query-answers.xml

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error




  # The Docker images are built from the repository konclude/KoncludeDocker and pushed to the
  # Docker Hub account of Konclude, so the Docker jobs only run in the repository of Konclude.
  # ATTENTION: the Dockerfiles of that repository still download Qt from a location that no
  # longer exists, libxml2 from ftp://xmlsoft.org and rasqal via git://github.com, which is no
  # longer served, so these jobs fail until KoncludeDocker is updated.
  prebuild_qt_docker:
    name: Ubuntu Latest Docker Qt Prebuild
    if: github.repository == 'konclude/Konclude'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: tags

    steps:
      - name: Prepare Directories
        run: |
          mkdir Konclude
          mkdir KoncludeDocker

      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: Konclude

      - name: Checkout Konclude Docker
        uses: actions/checkout@v4
        with:
          repository: konclude/KoncludeDocker
          path: KoncludeDocker

      - name: Cache Docker Konclude Run Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-run-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerRunImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/run/Dockerfile') }}

      - name: Build Run Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncluderun:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerRunImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./run/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Cache Docker Konclude Develop Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-develop-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/develop/Dockerfile') }}

      - name: Build Develop Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncludedev:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./develop/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE




  build_docker:
    name: Ubuntu Latest Docker Static
    if: github.repository == 'konclude/Konclude'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: [tags, prebuild_qt_docker]
    env:
      QT_DOCKER_VERSION: 5.12.10

    steps:
      - name: Prepare Directories
        run: |
          mkdir Konclude
          mkdir KoncludeDocker

      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: Konclude

      - name: Checkout Konclude Docker
        uses: actions/checkout@v4
        with:
          repository: konclude/KoncludeDocker
          path: KoncludeDocker

      - name: Update Revision Information
        run: |
          echo "#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{needs.tags.outputs.revision_build}}" > "Konclude/revision-git.h"
          echo "#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING \"${{needs.tags.outputs.revision_tag}}\"" >> "Konclude/revision-git.h"
          echo "#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING \"${{needs.tags.outputs.revision_hash}}\"" >> "Konclude/revision-git.h"

      - name: Cache Docker Konclude Run Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-run-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerRunImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/run/Dockerfile') }}

      - name: Build Run Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncluderun:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerRunImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./run/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Cache Docker Konclude Develop Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-develop-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/develop/Dockerfile') }}

      - name: Build Develop Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncludedev:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./develop/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Build Build Image
        working-directory: KoncludeDocker
        run: |
          echo "DockerCacheDirectory/" >> .dockerignore
          ./build/snap.sh

      - name: Build Deploy Image
        working-directory: KoncludeDocker
        run: |
          DOCKERIMAGE="konclude:latest"
          FILEIMAGE="../DockerCacheDirectory/Konclude-${{needs.tags.outputs.git_tag}}-Docker-Image.tar.gz"
          echo "DockerCacheDirectory/" >> .dockerignore
          ./deploy/snap.sh
          docker tag konclude konclude/konclude:latest
          docker tag konclude konclude/konclude:${{needs.tags.outputs.git_tag}}
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Build
        working-directory: KoncludeDocker
        run: |
          echo "DockerCacheDirectory/" >> .dockerignore
          ./build_release_parameterized.sh ${{needs.tags.outputs.revision_build}}  ${{needs.tags.outputs.revision_tag}} ${{needs.tags.outputs.revision_hash}}
          ls -al ../Release

      - name: Konclude Docker Test
        working-directory: Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}
        run: |
          docker run -v $(pwd)/Tests:/data --rm konclude owllinkfile -i /data/galen-ALEHIF+-classify-request.xml -o /data/test-response.xml

      - name: Konclude Examples Test
        working-directory: Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml

      - uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: |
            DockerCacheDirectory/Konclude-${{needs.tags.outputs.git_tag}}-Docker-Image.tar.gz
            Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}.zip
            Release/Konclude-${{needs.tags.outputs.git_tag}}-Sources.zip
          if-no-files-found: error

      - name: Log into registry
        if: needs.tags.outputs.publish == 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push image
        if: needs.tags.outputs.publish == 'true'
        run: |
          docker push konclude/konclude:latest
          docker push konclude/konclude:${{needs.tags.outputs.git_tag}}




  # Collects the packages of all platforms that could be built in a draft release, so that a
  # failure on one platform does not prevent the packages of the other platforms.
  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [tags, build_windows, build_macosx, build_linux, build_docker]
    if: always() && needs.tags.result == 'success' && needs.tags.outputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tags.outputs.git_tag }}
        run: |
          mapfile -t packages < <(find assets -type f 2>/dev/null)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No release package has been built."
            exit 1
          fi
          ls -l "${packages[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Konclude Release $TAG" --notes "$TAG" "${packages[@]}"
