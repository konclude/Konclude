name: Build Releases (with Redland)

# Builds the release packages of Konclude for Windows, macOS and Linux, and the Protege plug-in
# with the shared library of Konclude for all three, and collects them in a draft GitHub
# release. The workflow runs for tags that match releases/v*, where the name of
# the release is the tag without the releases/ prefix, and it can be started manually, where
# the release is named after the most recent tag and its creation can be switched off to only
# build and test the packages.
on:
  push:
    tags:
      - 'releases/v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release with the built packages'
        type: boolean
        default: true
      jemalloc_debug:
        description: 'Link a debug build of jemalloc into the Linux libraries, which aborts on a pointer it did not allocate (for testing, not for a release)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Qt version that is statically compiled for the macOS and Linux packages and for the library
  # of the Protege plug-in on all three platforms. Only the qtbase
  # module is built, since Konclude does not require any other module.
  QT_STATIC_VERSION: 5.15.17
  # Increase whenever the configuration of the static Qt build changes, to invalidate the cache.
  QT_STATIC_CACHE_REVISION: 2
  # Qt version that is dynamically linked for the Windows package.
  QT_WINDOWS_VERSION: 5.15.2


jobs:


  tags:
    name: Identify tags
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.get_tags.outputs.git_tag }}
      revision_hash: ${{ steps.get_tags.outputs.revision_hash }}
      revision_tag: ${{ steps.get_tags.outputs.revision_tag }}
      revision_build: ${{ steps.get_tags.outputs.revision_build }}
      publish: ${{ steps.get_tags.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify git tags
        id: get_tags
        env:
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        run: |
          # A pushed tag releases/v<version>-<build> names the release; a build started by hand takes the
          # version from the nearest plain tag v<version>-<build> (never from a releases/ tag, which is
          # why the match pattern is needed), so every build after a tag carries that version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git_tag="$GITHUB_REF_NAME"
          else
            git_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          fi
          git_tag="${git_tag#releases/}"
          if [[ ! "$git_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::The tag '$git_tag' does not have the form v<major>.<minor>.<patch>-<build>, e.g., v0.7.0-1139."
            exit 1
          fi
          revision_hash="$(git rev-parse --short=8 HEAD)"
          IFS='-' read -r revision_tag revision_build <<< "$git_tag"
          echo "tag: $git_tag, version: $revision_tag, build: $revision_build, hash: $revision_hash, publish: $PUBLISH"
          {
            echo "git_tag=$git_tag"
            echo "revision_hash=$revision_hash"
            echo "revision_tag=$revision_tag"
            echo "revision_build=$revision_build"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"




  build_windows:
    name: Windows x64 MSVC Dynamic
    runs-on: windows-latest
    timeout-minutes: 300
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-Windows-x64-MSVC-Dynamic-Qt5.15.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Revision Information
        shell: bash
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > revision-git.h
          cat revision-git.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_WINDOWS_VERSION }}
          cache: true

      # Qt 5.15.2 cannot be compiled with the standard library of Visual Studio 2022 17.10 and
      # above, see build-without-redland.yml, so the Visual Studio 2019 tool set is used, which
      # is the one the msvc2019_64 build of Qt has been made with.
      - name: Prepare Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.29'

      # The project targets the Visual Studio 2015 tool set and the Windows 8.1 SDK, neither of
      # which is available on the runners, so the tool set above and the installed Windows 10 SDK
      # are selected instead. The project expects the root directory of Qt in Qt5_Dir, whereas
      # install-qt-action sets Qt5_DIR to the CMake directory of Qt.
      - name: Compile Windows
        run: |
          msbuild Konclude-VS15.sln /m /p:Configuration=Release /p:Platform=Win64 /p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0 "/p:Qt5_Dir=$env:QT_ROOT_DIR"

      - name: Create Konclude Release
        run: |
          $RELEA = "Release\$env:RELEASE_NAME"
          New-Item -ItemType Directory -Force -Path "$RELEA\Configs", "$RELEA\Tests", "$RELEA\Binaries" | Out-Null

          Copy-Item "x64\Release\VS2015\Konclude.exe" "$RELEA\Binaries"
          Copy-Item "External\vcpkg\Windows\x64\bin\*.dll" "$RELEA\Binaries"
          foreach ($module in "Core", "Network", "Concurrent", "Xml") {
            Copy-Item "$env:QT_ROOT_DIR\bin\Qt5$module.dll" "$RELEA\Binaries"
          }

          Copy-Item "LGPL-3.0.txt", "GPL.txt", "Readme.md", "Scripts\Konclude.bat" "$RELEA"
          Copy-Item "Configs\default-config.xml", "Configs\querying-config.xml" "$RELEA\Configs"
          foreach ($test in "1b-satisfiability-request.xml", "galen.owl.xml", "galen-classify-request.xml",
                            "galen-ALEHIF+-classify-request.xml", "roberts-family-full-D.owl.xml",
                            "roberts-family-full-D-classify-realize-request.xml", "lubm-univ-bench.owl.xml",
                            "lubm-univ-bench-data-1.ttl", "lubm-univ-bench-sparql-load-and-query-test.sparql",
                            "lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql",
                            "roberts-family-full-sparql-existential-variables-query-test.sparql", "test-request.xml") {
            Copy-Item "Tests\$test" "$RELEA\Tests"
          }

      # The conformance runner checks the binary that was copied into the package.
      - name: Konclude Conformance Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path conformance-results | Out-Null
          & .\Binaries\Konclude.exe conformance -i ..\..\Tests\cases -o conformance-results\result.owl.xml -j "$env:NUMBER_OF_PROCESSORS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Konclude Redland Conformance Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        shell: pwsh
        run: |
          & .\Binaries\Konclude.exe conformance -i ..\..\Tests\redland-cases -o conformance-results\redland-result.owl.xml -j "$env:NUMBER_OF_PROCESSORS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Conformance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-windows-release
          path: |
            Release/${{ env.RELEASE_NAME }}/conformance-results/result.owl.xml
            Release/${{ env.RELEASE_NAME }}/conformance-results/redland-result.owl.xml
            Release/${{ env.RELEASE_NAME }}/conformance-results/test-outputs/
          if-no-files-found: ignore

      - name: Run Examples Windows
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          .\Konclude.bat classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          .\Konclude.bat satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          .\Konclude.bat owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          .\Konclude.bat owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          .\Konclude.bat owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          .\Konclude.bat sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          .\Konclude.bat sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          Remove-Item roberts-family-full-class-hierarchy.owl.xml, response.xml, Tests/query-answers.xml -ErrorAction SilentlyContinue

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$env:RELEASE_NAME.zip" "$env:RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error

      # The shared library for the Protege plug-in. The package above uses the Qt DLLs, which
      # System.loadLibrary would not find beside the library in the directory that OSGi extracts
      # it to, so the library is built against a static Qt with the static C runtime of MSVC
      # instead, and then depends on the system DLLs only, as on macOS and Linux. The Qt is
      # built with the same tool set as the package.
      - name: Cache static Qt
        id: cache-qt-static
        uses: actions/cache@v4
        with:
          path: qt-static
          key: qt-static-${{ runner.os }}-${{ runner.arch }}-msvc2019-static-runtime-${{ env.QT_STATIC_VERSION }}-${{ env.QT_STATIC_CACHE_REVISION }}

      # jom.ps1 retries the install of jom and falls back to nmake without it
      - name: Install jom
        run: |
          . .github/scripts/jom.ps1
          Install-Jom

      - name: Compile static Qt
        if: steps.cache-qt-static.outputs.cache-hit != 'true'
        run: |
          $ROOT = (Get-Location).Path
          $QT_MINOR = $env:QT_STATIC_VERSION.Substring(0, $env:QT_STATIC_VERSION.LastIndexOf('.'))
          curl.exe -fsSL --retry 5 -o qtbase.tar.xz "https://download.qt.io/archive/qt/$QT_MINOR/$env:QT_STATIC_VERSION/submodules/qtbase-everywhere-opensource-src-$env:QT_STATIC_VERSION.tar.xz"
          tar -xf qtbase.tar.xz
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location "qtbase-everywhere-src-$env:QT_STATIC_VERSION"
          .\configure.bat -static -static-runtime -release -opensource -confirm-license -prefix "$ROOT\qt-static" -platform win32-msvc `
            -no-gui -no-widgets -no-opengl -no-icu -no-dbus -qt-pcre -qt-zlib `
            -no-sql-mysql -no-sql-psql -no-sql-odbc -nomake examples -nomake tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          . "$ROOT\.github\scripts\jom.ps1"
          Invoke-Make
          Invoke-Make install

      # KoncludeLIB.pro takes the JNI include directories from JAVA_HOME
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile the Konclude library
        run: |
          New-Item -ItemType Directory -Force -Path konclude-lib, library | Out-Null
          Set-Location konclude-lib
          ..\qt-static\bin\qmake.exe -o Makefile ..\KoncludeLIB.pro -after "QT-=gui" "CONFIG-=static staticlib debug_and_release" "CONFIG+=shared dll"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          jom -j "$env:NUMBER_OF_PROCESSORS"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dependents = dumpbin /nologo /dependents Release\Konclude.dll
          $dependents
          $foreign = $dependents | Select-String -Pattern '^\s+(Qt5\S*|vcruntime\S*|msvcp\S*|api-ms-win-crt\S*|ucrtbase\S*)\.dll'
          if ($foreign) {
            Write-Output "::error::The library depends on DLLs that are not part of Windows: $($foreign -join ', ')"
            exit 1
          }
          Copy-Item Release\Konclude.dll ..\library\

      - name: Konclude Library Test
        shell: bash
        run: |
          ./Java/run-jni-smoke-test.sh library/Konclude.dll
          ./Java/run-owlapi-test.sh library/Konclude.dll

      - uses: actions/upload-artifact@v4
        with:
          name: library-windows
          path: library/Konclude.dll
          if-no-files-found: error

      - name: Keep the crash reports of the virtual machine
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-crash-reports-windows
          path: |
            hs_err_pid*.log
            Java/hs_err_pid*.log
            Java/crash-reports/*.log
          if-no-files-found: ignore




  build_macosx:
    name: macOS arm64 Clang Static
    runs-on: macos-latest
    timeout-minutes: 240
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-OSX-arm64-Clang-Static-Qt5.15.17

    steps:
      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: konclude-static

      - name: Update Revision Information
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > konclude-static/revision-git.h
          cat konclude-static/revision-git.h

      # The bison of the Xcode tools is too old to generate the parser of rasqal.
      - name: Install Dependencies
        run: |
          brew install autoconf automake libtool bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: qt-static
          key: qt-static-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_STATIC_VERSION }}-${{ env.QT_STATIC_CACHE_REVISION }}

      - name: Compile Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          ROOT="$(pwd)"
          curl -fsSL --retry 5 -o qtbase.tar.xz "https://download.qt.io/archive/qt/${QT_STATIC_VERSION%.*}/$QT_STATIC_VERSION/submodules/qtbase-everywhere-opensource-src-$QT_STATIC_VERSION.tar.xz"
          tar -xJf qtbase.tar.xz
          cd "qtbase-everywhere-src-$QT_STATIC_VERSION"
          ./configure -static -release -opensource -confirm-license -prefix "$ROOT/qt-static" -platform macx-clang \
            -no-gui -no-widgets -no-opengl -no-icu -no-dbus -no-feature-gssapi -no-zstd -qt-pcre \
            -no-sql-mysql -no-sql-psql -no-sql-odbc -nomake examples -nomake tests \
            QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Compile Dependencies
        run: |
          konclude-static/.github/scripts/build-static-dependencies.sh deps konclude-static

      # The generic library line of Konclude.pro refers to the shared libraries of libltdl and
      # GMP, which are not needed or linked statically here.
      - name: Prepare Konclude Compilation
        working-directory: konclude-static
        run: |
          sed -i '' -e 's#^unix: LIBS += -lz -lltdl -lgmp -ldl -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#unix: LIBS += -lz -liconv External/librdf/Linux/x64/lib/release/libgmp.a -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#' Konclude.pro
          grep -n "^unix: LIBS += -lz" Konclude.pro
          ../qt-static/bin/qmake CONFIG+=release CONFIG-=debug CONFIG+=static Konclude.pro -after "QT-=gui"

      - name: Compile Konclude
        working-directory: konclude-static
        run: |
          make -j"$(sysctl -n hw.ncpu)"
          otool -L Release/Konclude.app/Contents/MacOS/Konclude
          # the package must not depend on libraries outside of macOS, such as Homebrew ones
          if otool -L Release/Konclude.app/Contents/MacOS/Konclude | tail -n +2 | grep -vE "^\s*(/usr/lib/|/System/Library/)"; then
            echo "::error::Konclude depends on the libraries listed above, which are not part of macOS."
            exit 1
          fi

      - name: Create Konclude Release
        run: |
          ROOT="$(pwd)"
          PROJ="$ROOT/konclude-static"
          RELEA="$ROOT/Release/$RELEASE_NAME"
          mkdir -p "$RELEA/Configs" "$RELEA/Tests" "$RELEA/Binaries"

          cp "$PROJ/Release/Konclude.app/Contents/MacOS/Konclude" "$RELEA/Binaries"
          cp "$PROJ/LGPL-3.0.txt" "$PROJ/GPL.txt" "$PROJ/Readme.md" "$PROJ/Scripts/Konclude" "$PROJ/Scripts/Konclude.sh" "$RELEA"
          cp "$PROJ/Configs/default-config.xml" "$PROJ/Configs/querying-config.xml" "$RELEA/Configs"
          for test in 1b-satisfiability-request.xml galen.owl.xml galen-classify-request.xml \
                      galen-ALEHIF+-classify-request.xml roberts-family-full-D.owl.xml \
                      roberts-family-full-D-classify-realize-request.xml lubm-univ-bench.owl.xml \
                      lubm-univ-bench-data-1.ttl lubm-univ-bench-sparql-load-and-query-test.sparql \
                      lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql \
                      roberts-family-full-sparql-existential-variables-query-test.sparql test-request.xml; do
            cp "$PROJ/Tests/$test" "$RELEA/Tests"
          done
          chmod 755 "$RELEA/Binaries/Konclude" "$RELEA/Konclude" "$RELEA/Konclude.sh"

      # The conformance runner checks the binary that was copied into the package.
      - name: Konclude Conformance Test
        working-directory: konclude-static
        run: |
          mkdir -p ../conformance-results
          ../Release/${{ env.RELEASE_NAME }}/Binaries/Konclude conformance -i Tests/cases -o ../conformance-results/result.owl.xml -j "$(sysctl -n hw.ncpu)"

      - name: Konclude Redland Conformance Test
        working-directory: konclude-static
        run: |
          ../Release/${{ env.RELEASE_NAME }}/Binaries/Konclude conformance -i Tests/redland-cases -o ../conformance-results/redland-result.owl.xml -j "$(sysctl -n hw.ncpu)"

      - name: Upload Conformance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-macos-release
          path: |
            conformance-results/result.owl.xml
            conformance-results/redland-result.owl.xml
            conformance-results/test-outputs/
          if-no-files-found: ignore

      - name: Konclude Examples Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          rm -f roberts-family-full-class-hierarchy.owl.xml response.xml Tests/query-answers.xml

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error

      # The shared library for the Protege plug-in, against the same static Qt, so that it depends
      # on the system only, see 'A LIBRARY WITHOUT QT DEPENDENCIES' in Java/Readme.md. It is built
      # in a directory of its own, since KoncludeLIB.pro compiles the sources with the JNI
      # interface into the same object directory as Konclude.pro. A static Qt propagates
      # CONFIG += static, which would make the library an archive, hence the CONFIG arguments.
      # KoncludeLIB.pro takes the JNI include directories from JAVA_HOME.
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile the Konclude library
        run: |
          mkdir -p konclude-lib library
          cd konclude-lib
          ../qt-static/bin/qmake -o Makefile ../konclude-static/KoncludeLIB.pro -after "QT-=gui" "CONFIG-=static staticlib" "CONFIG+=shared dll"
          make -j"$(sysctl -n hw.ncpu)"
          otool -L Release/libKonclude.dylib
          # the first line is the install name of the library itself
          if otool -L Release/libKonclude.dylib | tail -n +3 | grep -vE "^\s*(/usr/lib/|/System/Library/)"; then
            echo "::error::The library depends on the libraries listed above, which are not part of macOS."
            exit 1
          fi
          cp -L Release/libKonclude.dylib ../library/

      - name: Konclude Library Test
        run: |
          konclude-static/Java/run-jni-smoke-test.sh library/libKonclude.dylib
          konclude-static/Java/run-owlapi-test.sh library/libKonclude.dylib

      # the plug-in inside the OSGi framework of Protege, as the push workflow does, but with the
      # library that is shipped
      - name: Download Protege
        run: |
          curl -fsSL --retry 5 -o protege.zip https://github.com/protegeproject/protege-distribution/releases/download/protege-5.6.6/Protege-5.6.6-platform-independent.zip
          unzip -q protege.zip -d protege
          ls -d protege/*/bundles

      - name: Konclude Plug-in Test
        run: konclude-static/Java/run-protege-plugin-test.sh "$(dirname "$(ls -d protege/*/bundles)")" library/libKonclude.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: library-macos
          path: library/libKonclude.dylib
          if-no-files-found: error

      - name: Keep the crash reports of the virtual machine
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-crash-reports-macos
          path: |
            hs_err_pid*.log
            konclude-static/Java/hs_err_pid*.log
            konclude-static/Java/crash-reports/*.log
            konclude-static/Java/protege/hs_err_pid*.log
          if-no-files-found: ignore




  # One job per architecture. The runners are the oldest available ones, so that the packages run
  # with as old a glibc as possible; docker is the platform name of the architecture for the image.
  build_linux:
    name: Linux ${{ matrix.arch }} GCC Static
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, docker: amd64 }
          - { arch: arm64, runner: ubuntu-22.04-arm, docker: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    needs: tags
    env:
      RELEASE_NAME: Konclude-${{ needs.tags.outputs.git_tag }}-Linux-${{ matrix.arch }}-GCC-Static-Qt5.15.17

    steps:
      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: konclude-static

      - name: Update Revision Information
        run: |
          {
            echo '#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{ needs.tags.outputs.revision_build }}'
            echo '#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING "${{ needs.tags.outputs.revision_tag }}"'
            echo '#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING "${{ needs.tags.outputs.revision_hash }}"'
          } > konclude-static/revision-git.h
          cat konclude-static/revision-git.h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config flex bison gperf \
            zlib1g-dev p7zip-full

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: qt-static
          key: qt-static-${{ runner.os }}-${{ runner.arch }}-${{ env.QT_STATIC_VERSION }}-${{ env.QT_STATIC_CACHE_REVISION }}

      # Features that would link further shared libraries into Qt are switched off, since they
      # might not be available on the systems the package is used on.
      - name: Compile Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          ROOT="$(pwd)"
          curl -fsSL --retry 5 -o qtbase.tar.xz "https://download.qt.io/archive/qt/${QT_STATIC_VERSION%.*}/$QT_STATIC_VERSION/submodules/qtbase-everywhere-opensource-src-$QT_STATIC_VERSION.tar.xz"
          tar -xJf qtbase.tar.xz
          cd "qtbase-everywhere-src-$QT_STATIC_VERSION"
          ./configure -static -release -opensource -confirm-license -prefix "$ROOT/qt-static" -platform linux-g++ \
            -no-gui -no-widgets -no-opengl -no-icu -no-dbus -no-feature-gssapi -no-zstd -no-glib -no-libproxy -qt-pcre \
            -no-sql-mysql -no-sql-psql -no-sql-odbc -nomake examples -nomake tests
          make -j"$(nproc)"
          make install

      - name: Compile Dependencies
        run: |
          konclude-static/.github/scripts/build-static-dependencies.sh deps konclude-static

      # The generic library line of Konclude.pro refers to the shared libraries of libltdl and
      # GMP, which are not needed or linked statically here. The C++ runtime is linked
      # statically as well, so that the package does not require a recent libstdc++.
      - name: Prepare Konclude Compilation
        working-directory: konclude-static
        run: |
          sed -i -e 's#^unix: LIBS += -lz -lltdl -lgmp -ldl -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#unix: LIBS += -lz -ldl -lpthread External/librdf/Linux/x64/lib/release/libgmp.a -L External/jemalloc/Linux/x64/lib/release/ -ljemalloc#' Konclude.pro
          grep -n "^unix: LIBS += -lz" Konclude.pro
          ../qt-static/bin/qmake CONFIG+=release CONFIG-=debug CONFIG+=static "QMAKE_LFLAGS+=-static-libstdc++ -static-libgcc" Konclude.pro -after "QT-=gui"

      - name: Compile Konclude
        working-directory: konclude-static
        run: |
          make -j"$(nproc)"
          ldd Release/Konclude
          # the package may only depend on the libraries of the C library and zlib
          if ldd Release/Konclude | grep -vE "(linux-vdso|ld-linux-[a-z0-9_-]+|libc|libm|libdl|libpthread|librt|libz)\.so"; then
            echo "::error::Konclude depends on the libraries listed above, which might not be available."
            exit 1
          fi

      # The conformance runner exercises the release binary against the answers in Tests/cases
      # before the binary is packaged, so a release cannot be built from a regressed reasoner.
      - name: Konclude Conformance Test
        working-directory: konclude-static
        run: |
          mkdir -p ../conformance-results
          Release/Konclude conformance -i Tests/cases -o ../conformance-results/result.owl.xml -j "$(nproc)"

      - name: Konclude Redland Conformance Test
        working-directory: konclude-static
        run: |
          Release/Konclude conformance -i Tests/redland-cases -o ../conformance-results/redland-result.owl.xml -j "$(nproc)"

      - name: Upload Conformance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-release-linux
          path: |
            conformance-results/result.owl.xml
            conformance-results/redland-result.owl.xml
            conformance-results/test-outputs/
          if-no-files-found: ignore

      - name: Create Konclude Release
        run: |
          ROOT="$(pwd)"
          PROJ="$ROOT/konclude-static"
          RELEA="$ROOT/Release/$RELEASE_NAME"
          mkdir -p "$RELEA/Configs" "$RELEA/Tests" "$RELEA/Binaries"

          cp "$PROJ/Release/Konclude" "$RELEA/Binaries"
          cp "$PROJ/LGPL-3.0.txt" "$PROJ/GPL.txt" "$PROJ/Readme.md" "$PROJ/Scripts/Konclude" "$PROJ/Scripts/Konclude.sh" "$RELEA"
          cp "$PROJ/Configs/default-config.xml" "$PROJ/Configs/querying-config.xml" "$RELEA/Configs"
          for test in 1b-satisfiability-request.xml galen.owl.xml galen-classify-request.xml \
                      galen-ALEHIF+-classify-request.xml roberts-family-full-D.owl.xml \
                      roberts-family-full-D-classify-realize-request.xml lubm-univ-bench.owl.xml \
                      lubm-univ-bench-data-1.ttl lubm-univ-bench-sparql-load-and-query-test.sparql \
                      lubm-univ-bench-sparql-load-and-complex-query-rasqal-test.sparql \
                      roberts-family-full-sparql-existential-variables-query-test.sparql test-request.xml; do
            cp "$PROJ/Tests/$test" "$RELEA/Tests"
          done
          chmod 755 "$RELEA/Binaries/Konclude" "$RELEA/Konclude" "$RELEA/Konclude.sh"

      - name: Konclude Examples Test
        working-directory: Release/${{ env.RELEASE_NAME }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml
          rm -f roberts-family-full-class-hierarchy.owl.xml response.xml Tests/query-answers.xml

      - name: Zip the release package
        working-directory: Release
        run: |
          7z a -tzip "$RELEASE_NAME.zip" "$RELEASE_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: Release/${{ env.RELEASE_NAME }}.zip
          if-no-files-found: error

      # A Docker image from the package and Docker/Dockerfile, built and run on the architecture it
      # is for; it is only tested here and not pushed anywhere.
      - name: Konclude Docker Image Test
        run: |
          mkdir -p docker-context
          cp -r "Release/$RELEASE_NAME" "docker-context/${{ matrix.docker }}"
          docker build -t konclude-test -f konclude-static/Docker/Dockerfile docker-context
          # the request loads file:./Tests/galen.owl.xml relative to the working directory, /data
          docker run --rm -v "$(pwd)/Release/$RELEASE_NAME":/data konclude-test \
            owllinkfile -i Tests/galen-classify-request.xml -o docker-response.xml
          response="Release/$RELEASE_NAME/docker-response.xml"
          if grep -q "<Error" "$response" || ! grep -q "<ClassSynset" "$response"; then
            echo "::error::The classification in the Docker image did not answer."
            head -c 2000 "$response"
            exit 1
          fi
          echo "$(grep -c '<ClassSynset' "$response") classes in the hierarchy"
          rm -f "$response"

      # The tested image, pushed to the GitHub Container Registry under its architecture when the run
      # publishes (the create_release input); the manifest job below joins the two architectures.
      - name: Push Docker Image for the Architecture
        if: needs.tags.outputs.publish == 'true'
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/konclude"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag konclude-test "$image:${{ needs.tags.outputs.git_tag }}-${{ matrix.docker }}"
          docker push "$image:${{ needs.tags.outputs.git_tag }}-${{ matrix.docker }}"

      # The shared library for the Protege plug-in, as for macOS. Static archives are linked into a
      # shared object only if they are position independent, which the mkspec of Qt makes them
      # (QMAKE_CFLAGS_STATIC_LIB includes -fPIC). The C++ runtime is linked statically as for the
      # package, and the symbols of all archives are kept local, so that the C++ runtime and Qt
      # inside the library do not interpose on those of the virtual machine or of other libraries.
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # jemalloc inside the library, hidden, for the library's allocations only; the program the
      # library is loaded into keeps its malloc. See 'THE MEMORY ALLOCATOR ON LINUX' in Java/Readme.md.
      - name: Compile jemalloc for the library
        run: |
          konclude-static/.github/scripts/build-jemalloc-library.sh jemalloc-work jemalloc-library \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.jemalloc_debug) && 'debug' || 'release' }}

      - name: Compile the Konclude library
        run: |
          mkdir -p konclude-lib library
          cd konclude-lib
          # the jemalloc settings before -after, since KoncludeLIB.pro's jemalloc scope has to see them
          ../qt-static/bin/qmake -o Makefile ../konclude-static/KoncludeLIB.pro \
            "CONFIG+=jemalloc" "JEMALLOC_LIB=$GITHUB_WORKSPACE/jemalloc-library/libjemalloc_pic.a" \
            -after "QT-=gui" "CONFIG-=static staticlib" "CONFIG+=shared dll" \
            "QMAKE_LFLAGS+=-static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"
          make -j"$(nproc)"
          ldd Release/libKonclude.so
          if ldd Release/libKonclude.so | grep -vE "(linux-vdso|ld-linux-[a-z0-9_-]+|libc|libm|libdl|libpthread|librt|libz)\.so"; then
            echo "::error::The library depends on the libraries listed above, which might not be available."
            exit 1
          fi
          # every allocation of the library has to go to jemalloc: it must neither import nor export
          # an allocation function of the C library
          if nm -D Release/libKonclude.so | grep -E " (malloc|calloc|realloc|free|aligned_alloc|posix_memalign|memalign|valloc|mallctl)(@|$)"; then
            echo "::error::The library imports or exports the allocation functions listed above, jemalloc is not used for all of its allocations."
            exit 1
          fi
          # and its calls to its own functions must not be taken over by the program's libstdc++.so
          if ! readelf -d Release/libKonclude.so | grep -q "(SYMBOLIC)"; then
            echo "::error::The library is not linked with -Bsymbolic, the program's libstdc++.so would supply some of its C++ functions, which allocate with the program's malloc."
            exit 1
          fi
          cp -L Release/libKonclude.so ../library/

      - name: Konclude Library Test
        run: |
          konclude-static/Java/run-jni-smoke-test.sh library/libKonclude.so
          konclude-static/Java/run-owlapi-test.sh library/libKonclude.so

      - uses: actions/upload-artifact@v4
        with:
          name: library-linux-${{ matrix.arch }}
          path: library/libKonclude.so
          if-no-files-found: error

      - name: Keep the crash reports of the virtual machine
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-crash-reports-linux-${{ matrix.arch }}
          path: |
            hs_err_pid*.log
            konclude-static/Java/hs_err_pid*.log
            konclude-static/Java/crash-reports/*.log
          if-no-files-found: ignore




  # The multi-architecture image: one manifest for the amd64 and the arm64 images the Linux jobs
  # pushed, tagged with the release tag and as latest, at ghcr.io/<owner>/konclude. The image is
  # Docker/Dockerfile, i.e. ubuntu:24.04 with the statically linked package; the package's GALEN
  # classification ran in it on each architecture before the push. Nothing is pushed unless the
  # run publishes. A new package on the registry is private until its visibility is changed once
  # in the repository owner's package settings.
  publish_docker:
    name: Docker Image Manifest
    if: needs.tags.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tags, build_linux]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and Push the Manifest
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/konclude"
          tag="${{ needs.tags.outputs.git_tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$image:$tag" -t "$image:latest" "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag"
          echo "::notice::Docker image $image:$tag (amd64, arm64) and $image:latest"

  # The Protege plug-in with the libraries of all platforms, see Java/Readme.md. The version of
  # the plug-in is the one of the release, e.g., 0.7.0-1138 for v0.7.0-1138, which the bundle
  # plug-in turns into the OSGi version 0.7.0.1138.
  build_plugin:
    name: Protege Plug-in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tags, build_windows, build_macosx, build_linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: libraries

      - name: Build the plug-in
        working-directory: Java/protege
        env:
          GIT_TAG: ${{ needs.tags.outputs.git_tag }}
        run: |
          ls -lR ../../libraries
          mvn -B -q versions:set -DnewVersion="${GIT_TAG#v}" -DgenerateBackupPoms=false
          mvn -B package \
            -Dkonclude.library.macos-arm64="$GITHUB_WORKSPACE/libraries/library-macos/libKonclude.dylib" \
            -Dkonclude.library.linux-x64="$GITHUB_WORKSPACE/libraries/library-linux-x64/libKonclude.so" \
            -Dkonclude.library.linux-arm64="$GITHUB_WORKSPACE/libraries/library-linux-arm64/libKonclude.so" \
            -Dkonclude.library.windows-x64="$GITHUB_WORKSPACE/libraries/library-windows/Konclude.dll"
          jar="target/konclude-protege-plugin-${GIT_TAG#v}.jar"
          unzip -l "$jar"
          unzip -p "$jar" META-INF/MANIFEST.MF
          for library in lib/native/macos-arm64/libKonclude.dylib lib/native/linux-x64/libKonclude.so \
                         lib/native/linux-arm64/libKonclude.so lib/native/windows-x64/Konclude.dll; do
            if ! unzip -l "$jar" "$library" >/dev/null; then
              echo "::error::The plug-in does not contain $library."
              exit 1
            fi
          done
          mkdir -p ../../plugin
          cp "$jar" ../../plugin/

      - uses: actions/upload-artifact@v4
        with:
          name: release-plugin
          path: plugin/*.jar
          if-no-files-found: error




  # The Docker images are built from the repository konclude/KoncludeDocker and pushed to the
  # Docker Hub account of Konclude, so the Docker jobs only run in the repository of Konclude.
  # ATTENTION: the Dockerfiles of that repository still download Qt from a location that no
  # longer exists, libxml2 from ftp://xmlsoft.org and rasqal via git://github.com, which is no
  # longer served, so these jobs fail until KoncludeDocker is updated.
  prebuild_qt_docker:
    name: Ubuntu Latest Docker Qt Prebuild
    if: github.repository == 'konclude/Konclude'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: tags

    steps:
      - name: Prepare Directories
        run: |
          mkdir Konclude
          mkdir KoncludeDocker

      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: Konclude

      - name: Checkout Konclude Docker
        uses: actions/checkout@v4
        with:
          repository: konclude/KoncludeDocker
          path: KoncludeDocker

      # KoncludeDocker still points at download locations that were taken down.
      # Patch the checkout until that repository is updated.
      - name: Patch Dockerfile download locations
        working-directory: KoncludeDocker
        run: |
          sed -i \
            -e 's#https://download.qt.io/official_releases/qt/#https://download.qt.io/archive/qt/#g' \
            -e 's#ftp://xmlsoft.org/libxml2/libxml2-2.9.9.tar.gz#https://download.gnome.org/sources/libxml2/2.9/libxml2-2.9.9.tar.xz#' \
            -e 's#tar -xvzf libxml2-2.9.9.tar.gz#tar -xJf libxml2-2.9.9.tar.xz#' \
            -e 's#git://github.com/#https://github.com/#g' \
            -e 's#git clone https://github.com/konclude/rasqal.git#git -c url.https://github.com/.insteadOf=git://github.com/ clone --recursive https://github.com/konclude/rasqal.git#' \
            -e '/# download, build and install rasqal/i RUN git config --global url."https://github.com/".insteadOf "git://github.com/"' \
            develop/Dockerfile
          git --no-pager diff -- develop/Dockerfile

      - name: Cache Docker Konclude Run Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-run-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerRunImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/run/Dockerfile') }}

      - name: Build Run Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncluderun:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerRunImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./run/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Cache Docker Konclude Develop Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-develop-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/develop/Dockerfile') }}

      - name: Build Develop Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncludedev:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./develop/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE




  build_docker:
    name: Ubuntu Latest Docker Static
    if: github.repository == 'konclude/Konclude'
    runs-on: ubuntu-latest
    timeout-minutes: 600
    needs: [tags, prebuild_qt_docker]
    env:
      QT_DOCKER_VERSION: 5.12.10

    steps:
      - name: Prepare Directories
        run: |
          mkdir Konclude
          mkdir KoncludeDocker

      - name: Checkout Konclude code
        uses: actions/checkout@v4
        with:
          path: Konclude

      - name: Checkout Konclude Docker
        uses: actions/checkout@v4
        with:
          repository: konclude/KoncludeDocker
          path: KoncludeDocker

      # KoncludeDocker still points at download locations that were taken down.
      # Patch the checkout until that repository is updated.
      - name: Patch Dockerfile download locations
        working-directory: KoncludeDocker
        run: |
          sed -i \
            -e 's#https://download.qt.io/official_releases/qt/#https://download.qt.io/archive/qt/#g' \
            -e 's#ftp://xmlsoft.org/libxml2/libxml2-2.9.9.tar.gz#https://download.gnome.org/sources/libxml2/2.9/libxml2-2.9.9.tar.xz#' \
            -e 's#tar -xvzf libxml2-2.9.9.tar.gz#tar -xJf libxml2-2.9.9.tar.xz#' \
            -e 's#git://github.com/#https://github.com/#g' \
            -e 's#git clone https://github.com/konclude/rasqal.git#git -c url.https://github.com/.insteadOf=git://github.com/ clone --recursive https://github.com/konclude/rasqal.git#' \
            -e '/# download, build and install rasqal/i RUN git config --global url."https://github.com/".insteadOf "git://github.com/"' \
            develop/Dockerfile
          git --no-pager diff -- develop/Dockerfile

      - name: Update Revision Information
        run: |
          echo "#define KONCLUDE_VERSION_GIT_REVISION_NUMBER ${{needs.tags.outputs.revision_build}}" > "Konclude/revision-git.h"
          echo "#define KONCLUDE_VERSION_GIT_TAG_NAME_STRING \"${{needs.tags.outputs.revision_tag}}\"" >> "Konclude/revision-git.h"
          echo "#define KONCLUDE_VERSION_GIT_REVISION_HASH_STRING \"${{needs.tags.outputs.revision_hash}}\"" >> "Konclude/revision-git.h"

      - name: Cache Docker Konclude Run Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-run-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerRunImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/run/Dockerfile') }}

      - name: Build Run Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncluderun:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerRunImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./run/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Cache Docker Konclude Develop Image
        uses: actions/cache@v4
        env:
          cache-name: cache-konclude-docker-develop-Image
        with:
          path: DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('KoncludeDocker/develop/Dockerfile') }}

      - name: Build Develop Image
        working-directory: KoncludeDocker
        run: |
          mkdir -p ../DockerCacheDirectory
          DOCKERIMAGE="koncludedev:latest"
          FILEIMAGE="../DockerCacheDirectory/KoncludeDockerDevelopImage.tar.gz"
          if test -f "$FILEIMAGE"; then
            docker load -i $FILEIMAGE
          fi
          echo "DockerCacheDirectory/" >> .dockerignore
          ./develop/snap.sh
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Build Build Image
        working-directory: KoncludeDocker
        run: |
          echo "DockerCacheDirectory/" >> .dockerignore
          ./build/snap.sh

      - name: Build Deploy Image
        working-directory: KoncludeDocker
        run: |
          DOCKERIMAGE="konclude:latest"
          FILEIMAGE="../DockerCacheDirectory/Konclude-${{needs.tags.outputs.git_tag}}-Docker-Image.tar.gz"
          echo "DockerCacheDirectory/" >> .dockerignore
          ./deploy/snap.sh
          docker tag konclude konclude/konclude:latest
          docker tag konclude konclude/konclude:${{needs.tags.outputs.git_tag}}
          docker save $(docker history -q $DOCKERIMAGE | tr '\n' ' ' | tr -d '<missing>') | gzip >  $FILEIMAGE

      - name: Build
        working-directory: KoncludeDocker
        run: |
          echo "DockerCacheDirectory/" >> .dockerignore
          ./build_release_parameterized.sh ${{needs.tags.outputs.revision_build}}  ${{needs.tags.outputs.revision_tag}} ${{needs.tags.outputs.revision_hash}}
          ls -al ../Release

      - name: Konclude Docker Test
        working-directory: Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}
        run: |
          docker run -v $(pwd)/Tests:/data --rm konclude owllinkfile -i /data/galen-ALEHIF+-classify-request.xml -o /data/test-response.xml

      - name: Konclude Examples Test
        working-directory: Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}
        run: |
          ./Konclude classification -i Tests/roberts-family-full-D.owl.xml -o roberts-family-full-class-hierarchy.owl.xml
          ./Konclude satisfiability -i Tests/roberts-family-full-D.owl.xml -x http://www.co-ode.org/roberts/family-tree.owl#Aunt
          ./Konclude owllinkfile -i Tests/galen-classify-request.xml -o response.xml
          ./Konclude owllinkfile -i Tests/roberts-family-full-D-classify-realize-request.xml
          ./Konclude owllinkfile -c Configs/default-config.xml -i Tests/1b-satisfiability-request.xml
          ./Konclude sparqlfile -s Tests/lubm-univ-bench-sparql-load-and-query-test.sparql -o Tests/query-answers.xml -c Configs/querying-config.xml
          ./Konclude sparqlfile -s Tests/roberts-family-full-sparql-existential-variables-query-test.sparql -i Tests/roberts-family-full-D.owl.xml

      - uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: |
            DockerCacheDirectory/Konclude-${{needs.tags.outputs.git_tag}}-Docker-Image.tar.gz
            Release/Konclude-${{needs.tags.outputs.git_tag}}-Linux-Docker-Compiled-x64-GCC4.8.4-Static-Qt${{ env.QT_DOCKER_VERSION }}.zip
            Release/Konclude-${{needs.tags.outputs.git_tag}}-Sources.zip
          if-no-files-found: error

      - name: Log into registry
        if: needs.tags.outputs.publish == 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push image
        if: needs.tags.outputs.publish == 'true'
        run: |
          docker push konclude/konclude:latest
          docker push konclude/konclude:${{needs.tags.outputs.git_tag}}




  # Collects the packages of all platforms that could be built in a draft release, so that a
  # failure on one platform does not prevent the packages of the other platforms.
  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [tags, build_windows, build_macosx, build_linux, build_plugin, build_docker]
    if: always() && needs.tags.result == 'success' && needs.tags.outputs.publish == 'true'
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tags.outputs.git_tag }}
        run: |
          mapfile -t packages < <(find assets -type f 2>/dev/null)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No release package has been built."
            exit 1
          fi
          ls -l "${packages[@]}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Konclude Release $TAG" --notes "$TAG" "${packages[@]}"
